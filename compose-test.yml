name: book-recorder-test

services:
  db:
    image: postgres:16-alpine
    restart: always
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U postgres -d book_recorder_test -h 127.0.0.1',
        ]
      interval: 1s
      timeout: 3s
      retries: 30
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=book_recorder_test
    container_name: postgres_book_recorder_test
    ports:
      - '${BOOK_RECORDER_TEST_DB_PORT:-5434}:5432'
